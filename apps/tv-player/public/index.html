<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Silva Signage Network</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        overflow: hidden;
        cursor: none;
        font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #stage {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #000;
      }
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        opacity: 0;
        transition: opacity 400ms linear;
      }
      .layer.on {
        opacity: 1;
      }
      /* 5% safe area for TV overscan */
      .panel {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 5vh 5vw;
        box-sizing: border-box;
        text-align: center;
        background: radial-gradient(circle at 75% 15%, #16324f 0%, #0c1218 60%, #070b10 100%);
      }
      .panel.on {
        display: flex;
      }
      .logo {
        height: 11vh;
        width: auto;
        margin-bottom: 2vh;
      }
      .brand {
        font-size: 3.2vh;
        letter-spacing: 0.02em;
        color: #4a9bea;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        margin: 0 0 6vh;
        font-weight: 600;
      }
      .code {
        font-size: 15vh;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
        margin: 2vh 0;
        color: #fff;
      }
      .lead {
        font-size: 3.6vh;
        margin: 0;
        color: #e8eef5;
      }
      .small {
        font-size: 2.4vh;
        color: #9fb2c6;
        margin: 2vh 0 0;
        max-width: 70vw;
        line-height: 1.4;
      }
      .tagline {
        font-size: 5vh;
        font-weight: 600;
        margin: 0;
      }
      #status {
        position: fixed;
        right: 2vw;
        bottom: 2vh;
        font-size: 1.6vh;
        color: rgba(255, 255, 255, 0.45);
        display: none;
      }
      #status.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="imgA" class="layer" alt="" />
      <img id="imgB" class="layer" alt="" />
      <video id="video" class="layer" muted playsinline preload="auto"></video>

      <section id="pairing" class="panel" aria-live="polite">
        <img class="logo" src="brand/silva-logo-white.png" alt="Silva Solutions Ltd" />
        <p class="brand">Signage Network</p>
        <p class="lead">Pair this screen</p>
        <div id="code" class="code">····-····</div>
        <p id="pairHelp" class="small"></p>
        <p id="pairExpiry" class="small"></p>
      </section>

      <section id="fallback" class="panel">
        <img class="logo" src="brand/silva-logo-white.png" alt="Silva Solutions Ltd" />
        <p class="brand">Signage Network</p>
        <p class="tagline">Local businesses. Local screens.</p>
        <p id="fallbackNote" class="small"></p>
      </section>

      <section id="message" class="panel">
        <img class="logo" src="brand/silva-logo-white.png" alt="Silva Solutions Ltd" />
        <p id="messageText" class="lead"></p>
      </section>
    </div>
    <div id="status"></div>
    <script src="player.js"></script>
  </body>
</html>
