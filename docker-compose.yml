# Local infrastructure for development. Not a production deployment.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: silva
      POSTGRES_PASSWORD: silva_dev
      POSTGRES_DB: silva_signage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silva"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: silva-dev
      MINIO_ROOT_PASSWORD: silva-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
